<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="An ongoing conversation over coffee. An infinite scrolling webcomic.">
<title>Infinite Scroll Comic</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3eee4;color:#29251f;font-family:Georgia,serif}main{max-width:800px;margin:auto;padding:32px 16px}h1{font-size:clamp(2rem,6vw,3.5rem);margin:0 0 8px}header{border-bottom:2px solid;padding-bottom:20px;margin-bottom:24px}.comic-panel{position:relative;aspect-ratio:4/3;border:2px solid;background:#fffdf8;overflow:hidden}.comic-panel img{width:100%;height:100%;object-fit:contain}.dialogue{position:absolute;top:5%;max-width:42%;padding:12px;border:2px solid;border-radius:50%;background:white;font:1rem/1.3 system-ui,sans-serif}.dialogue.left{left:4%}.dialogue.right{right:4%}.placeholder{display:grid;place-items:center;text-align:center;padding:24px;color:#726957}footer{padding:24px 0;font:0.85rem system-ui,sans-serif}
</style>
</head>
<body>
<main>
<header><h1>Infinite Scroll Comic</h1><p>Another cup. Another conversation.</p></header>
<section id="comic" aria-label="Webcomic"><div class="comic-panel placeholder"><p>The counter is ready.<br>Artwork and dialogue coming soon.</p></div></section>
<footer>An ongoing conversation over coffee.</footer>
</main>
<!-- Add reusable panel artwork inside .comic-panel; layer text using .dialogue.left and .dialogue.right. Keep generated dialogue separate from artwork. -->
</body>
</html>
